<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --line:#e2e6eb;
  --ink:#1b1f24; --ink2:#4a5158; --ink3:#8b939c;
  --brand:#1a5fd0; --red:#d32d3a;
}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171a; --surface:#1c2024; --line:#2c3238;
    --ink:#eef1f4; --ink2:#b6bec6; --ink3:#828b94;
    --brand:#5b9cff; --red:#ff6b76;
  }
}
:root[data-theme="dark"]{
  --bg:#14171a; --surface:#1c2024; --line:#2c3238;
  --ink:#eef1f4; --ink2:#b6bec6; --ink3:#828b94;
  --brand:#5b9cff; --red:#ff6b76;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:1120px;margin:0 auto;padding:14px 12px 40px}

header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.logo{font-size:22px;font-weight:800;letter-spacing:.02em;text-decoration:none}
.logo .a{color:var(--red)} .logo .b{color:var(--brand)}
.back{margin-left:auto;font-size:13px;color:var(--brand);text-decoration:none}
.back:hover{text-decoration:underline}
h1{font-size:17px;margin:0 0 10px}

/* 絞り込み */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar select,.bar input{font:inherit;padding:7px 10px;border:1px solid var(--line);
border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.bar input{flex:1 1 200px}
.count{font-size:12px;color:var(--ink3);margin-left:auto}

/* 月の見出し */
.month{margin:22px 0 8px;font-size:15px;font-weight:700;color:var(--ink2);
border-left:4px solid var(--brand);padding-left:8px}

/* 一覧 */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:96px 78px 1fr;gap:10px;align-items:center;
background:var(--surface);border:1px solid var(--line);border-radius:10px;
padding:10px 12px;text-decoration:none;color:inherit}
.row:hover{border-color:var(--brand)}
.d{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.d .wd{font-size:11px;color:var(--ink3);margin-left:4px;font-weight:500}
.d.sat{color:#2f7ad6} .d.sun{color:var(--red)}
.pf{font-size:12px;text-align:center;padding:3px 6px;border-radius:999px;
background:rgba(26,95,208,.10);color:var(--brand);white-space:nowrap;
overflow:hidden;text-overflow:ellipsis}
/* 会場名は原文のまま持ち、表示のときだけ2行で省略する */
.sp{font-size:13px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:28px 10px;text-align:center;color:var(--ink3);font-size:13px}

@media(max-width:600px){
  .row{grid-template-columns:74px 1fr;row-gap:4px;padding:9px 10px}
  .pf{grid-row:1;grid-column:2;justify-self:start}
  .sp{grid-column:1 / -1}
}

footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);
font-size:12px;color:var(--ink3)}
footer p{margin:4px 0}
</style>

const WD = ['日','月','火','水','木','金','土'];

const $pref = document.getElementById('pref');
const $range = document.getElementById('range');
const $q = document.getElementById('q');
const $list = document.getElementById('list');
const $count = document.getElementById('count');

// 今日の0時。過ぎた開催は出さない。
const today = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const asDate = s => { const [y,m,d] = String(s).split('-').map(Number);
  return new Date(y, (m||1)-1, d||1); };

// 都道府県の選択肢は、実際に開催があるものだけ出す
(() => {
  const keys = [...new Set(EVENTS.map(e => e.pref))]
    .filter(k => PREF_LABELS[k])
    .sort((a,b) => Object.keys(PREF_LABELS).indexOf(a) - Object.keys(PREF_LABELS).indexOf(b));
  for(const k of keys){
    const o = document.createElement('option');
    o.value = k; o.textContent = PREF_LABELS[k];
    $pref.appendChild(o);
  }
})();

function render(){
  const pf = $pref.value;
  const months = parseInt($range.value, 10) || 0;
  const q = $q.value.trim();
  let limit = null;
  if(months){ limit = new Date(today); limit.setMonth(limit.getMonth() + months); }

  const rows = EVENTS
    .filter(e => {
      const d = asDate(e.date);
      if(d < today) return false;                     // 済んだ開催は出さない
      if(limit && d > limit) return false;
      if(pf && e.pref !== pf) return false;
      if(q && !(e.shop || '').includes(q)) return false;
      return true;
    })
    .sort((a,b) => a.date.localeCompare(b.date) || (a.label||'').localeCompare(b.label||''));

  $count.textContent = rows.length ? rows.length + '件' : '';
  $list.innerHTML = '';
  if(!rows.length){
    $list.innerHTML = '<div class="empty">条件に合う開催情報がありません。</div>';
    return;
  }

  let month = '';
  for(const e of rows){
    const d = asDate(e.date);
    const key = d.getFullYear() + '-' + (d.getMonth() + 1);
    if(key !== month){
      month = key;
      const h = document.createElement('div');
      h.className = 'month';
      h.textContent = d.getFullYear() + '年 ' + (d.getMonth() + 1) + '月';
      $list.appendChild(h);
    }
    const a = document.createElement('a');
    a.className = 'row';
    a.href = e.url; a.target = '_blank'; a.rel = 'noopener';
    const wd = d.getDay();
    a.innerHTML =
      '<span class="d ' + (wd === 0 ? 'sun' : wd === 6 ? 'sat' : '') + '">' +
        (d.getMonth() + 1) + '/' + d.getDate() +
        '<span class="wd">(' + WD[wd] + ')</span></span>' +
      '<span class="pf"></span><span class="sp"></span>';
    a.querySelector('.pf').textContent = e.label || '?';
    a.querySelector('.sp').textContent = e.shop || '';
    $list.appendChild(a);
  }
}

$pref.addEventListener('change', render);
$range.addEventListener('change', render);
$q.addEventListener('input', render);
render();
</script>
</body>
</html>
