*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);

.wrap{max-width:1120px;margin:0 auto;padding:14px 12px 40px}

/* 画面の上端は、端から端まで白い帯にする。

   浮いて輪郭が甘く見えるため）ので、ダークテーマでもこの帯だけは白で固定する。
   帯の中の色も、テーマ変数ではなく明るい側の固定値を使う。 */
.topbar{background:#fff;border-bottom:1px solid #e2e6eb}
header{max-width:1120px;margin:0 auto;padding:10px 12px;
display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:600px){header{padding:12px}}
/* ロゴは画像。文字情報は alt が持っているので読み上げ・検索とも問題ない */
.logo{display:block;line-height:0;text-decoration:none}
.logo img{width:190px;height:auto;max-width:52vw;display:block}
@media(max-width:600px){.logo img{width:160px}}
.back{margin-left:auto;font-size:13px;color:#1a5fd0;text-decoration:none}
.back:hover{text-decoration:underline}
h1{font-size:17px;margin:0 0 10px}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar select,.bar input{font:inherit;padding:7px 10px;border:1px solid var(--line);

.bar input{flex:1 1 200px}
.count{font-size:12px;color:var(--ink3);margin-left:auto}

border-left:4px solid var(--brand);padding-left:8px}

/* 一覧 */
.list{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;
padding:10px 12px}
.row:hover{border-color:var(--brand)}
.d{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.d .wd{font-size:11px;color:var(--ink3);margin-left:4px;font-weight:500}
.d.sat{color:#2f7ad6} .d.sun{color:var(--red)}
.pf{font-size:12px;text-align:center;padding:3px 6px;border-radius:999px;
background:rgba(26,95,208,.10);color:var(--brand);white-space:nowrap;
overflow:hidden;text-overflow:ellipsis}
/* 会場名は原文のまま持ち、表示のときだけ省略する（省略の指定は .txt 側） */
.sp{font-size:13px;color:var(--ink2)}
.empty{padding:28px 10px;text-align:center;color:var(--ink3);font-size:13px}

/* 画面には出さず、読み上げと検索エンジンにだけ伝える文字 */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
clip:rect(0,0,0,0);white-space:nowrap;border:0}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chip{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;cursor:pointer;

color:var(--ink2);white-space:nowrap}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .n{font-size:11px;font-weight:600;opacity:.7;margin-left:5px}

.chips.pref{margin:-2px 0 10px}
.chips.pref .chip{font-size:12px;font-weight:600;padding:5px 10px}
.chips.pref[hidden]{display:none}

.favbtn:hover{border-color:#e0a300;color:#e0a300}
.favbtn[aria-pressed="true"]{background:#e0a300;border-color:#e0a300;color:#fff}
.favbtn:disabled{opacity:.4;cursor:default}

.row .main{display:grid;grid-template-columns:96px 78px 1fr;gap:10px;align-items:center;

.fav{position:absolute;top:50%;right:8px;transform:translateY(-50%);

.txt{display:flex;flex-wrap:wrap;gap:0 1em;align-items:baseline;min-width:0}
.sp{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nm{flex:1 1 auto;min-width:0;font-size:12px;color:var(--ink3);

.nm:empty{display:none}

.favrow{margin:0 0 10px}

  .pf{grid-row:1;grid-column:2;justify-self:start}
  .txt{grid-column:1 / -1}
  /* 狭い画面では横に並べきれないので、大会名を会場名の下の行へ落とす。

  .txt{gap:2px 0}

  overflow-wrap:anywhere;word-break:break-word}
  .nm{flex:1 1 100%;white-space:normal;text-overflow:clip;

footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);

footer p{margin:4px 0}

// 都道府県キー → 日本語表記
const PREF_LABELS = {
  hokkaido:'北海道', aomori:'青森', iwate:'岩手', miyagi:'宮城', akita:'秋田',
  yamagata:'山形', fukushima:'福島', ibaraki:'茨城', tochigi:'栃木', gunma:'群馬',
  saitama:'埼玉', chiba:'千葉', tokyo:'東京', kanagawa:'神奈川', niigata:'新潟',
  toyama:'富山', ishikawa:'石川', fukui:'福井', yamanashi:'山梨', nagano:'長野',
  gifu:'岐阜', shizuoka:'静岡', aichi:'愛知', mie:'三重', shiga:'滋賀',
  kyoto:'京都', osaka:'大阪', hyogo:'兵庫', nara:'奈良', wakayama:'和歌山',
  tottori:'鳥取', shimane:'島根', okayama:'岡山', hiroshima:'広島', yamaguchi:'山口',
  tokushima:'徳島', kagawa:'香川', ehime:'愛媛', kochi:'高知', fukuoka:'福岡',
  saga:'佐賀', nagasaki:'長崎', kumamoto:'熊本', oita:'大分', miyazaki:'宮崎',
  kagoshima:'鹿児島', okinawa:'沖縄'
};

// 地域区分。タミヤ公式のイベント一覧の「地域で絞り込む」と同じ区分・同じ並び。
// 一般的な8地方区分とは違い、甲信越/北陸と東海に分かれ、中国と四国が1つ、
// 九州と沖縄が別になっている。三重は東海に入れている。
const REGIONS = [
  ['北海道',      ['hokkaido']],
  ['東北',        ['aomori','iwate','miyagi','akita','yamagata','fukushima']],
  ['関東',        ['ibaraki','tochigi','gunma','saitama','chiba','tokyo','kanagawa']],
  ['甲信越/北陸', ['yamanashi','nagano','niigata','toyama','ishikawa','fukui']],
  ['東海',        ['gifu','shizuoka','aichi','mie']],
  ['近畿',        ['shiga','kyoto','osaka','hyogo','nara','wakayama']],
  ['中国/四国',   ['tottori','shimane','okayama','hiroshima','yamaguchi',
                   'tokushima','kagawa','ehime','kochi']],
  ['九州',        ['fukuoka','saga','nagasaki','kumamoto','oita','miyazaki','kagoshima']],
  ['沖縄',        ['okinawa']]
];
const REGION_OF = (() => {
  const m = {};
  for(const [name, keys] of REGIONS) for(const k of keys) m[k] = name;
  return m;
})();
const WD = ['日','月','火','水','木','金','土'];

// 大会名は「〜 at 会場名」の形が多い。会場名は隣に出しているので落とす。
// 全角の＠は前後に空白を置かない書き方が多いので単独でも受け、
// 半角の at / @ は語の一部を誤って切らないよう前後の空白を必須にする。
const AT_TAIL = /(?:(?:\s|　)(?:at|AT|At|@)(?:\s|　)+|　?＠(?:\s|　)*)[^\n]*$/;
const NAME_MAX = 30;          // 大会名の最大文字数。これを超えたら … で切る

// 切れ目が語の途中や記号の直後にならないよう、末尾の区切り文字を落としてから … を足す
function cut(text, max){
  if(text.length <= max) return text;
  return text.slice(0, max).replace(/[\s　、。,.・/／\-–—~〜（(【[「『]+$/, '') + '…';
}

function eventTitle(e){
  let t = (e.name || '').trim();
  if(!t) return '';
  const short = t.replace(AT_TAIL, '').trim();
  if(short.length >= 4) t = short;      // 落とした結果が短すぎるときは元に戻す
  if(!t || t === (e.shop || '').trim()) return '';
  return cut(t, NAME_MAX);
}

const $favRow = document.getElementById('favRow');
const $regions = document.getElementById('regions');
const $prefs = document.getElementById('prefs');
const $favOnly = document.getElementById('favOnly');
const $range = document.getElementById('range');
const $q = document.getElementById('q');
const $list = document.getElementById('list');
const $count = document.getElementById('count');

let region = '';    // '' = 全国
let pref = '';      // '' = その地域すべて
let favOnly = false;

// 今日の0時。過ぎた開催は出さない。
const today = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const asDate = s => { const [y,m,d] = String(s).split('-').map(Number);
  return new Date(y, (m||1)-1, d||1); };

// これから開催されるものだけを土台にする（チップの件数もこれで数える）
const UPCOMING = EVENTS.filter(e => asDate(e.date) >= today);

// ---- お気に入りの店（このブラウザにだけ保存。ログイン不要） ----
const FAV_KEY = 'mini4rinku:favshops';
let favs = new Set();
try{ favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); }catch(e){}
function saveFavs(){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }catch(e){}
}
// 店の見分けは会場名で行う。同じ店の別開催もまとめてお気に入りになる。
const shopKey = e => (e.shop || '').trim();

function syncFavButton(){
  // 登録が無いうちは行ごと出さない（押せないボタンを置いておかない）
  if(!favs.size){
    favOnly = false;
    $favRow.hidden = true;
    $favOnly.setAttribute('aria-pressed', 'false');
    return;
  }
  const n = UPCOMING.filter(e => favs.has(shopKey(e))).length;
  $favOnly.textContent = `★ お気に入りの店（${n}件）`;
  $favRow.hidden = false;
  $favOnly.setAttribute('aria-pressed', favOnly ? 'true' : 'false');
}

// ---- 地域チップ（開催があるものだけ出す） ----
function buildRegions(){
  const count = {};
  for(const e of UPCOMING){
    const r = REGION_OF[e.pref];
    if(r) count[r] = (count[r] || 0) + 1;
  }
  const mk = (label, value, n) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.v = value;
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span></span><span class="n"></span>';
    b.firstChild.textContent = label;
    b.lastChild.textContent = n;
    return b;
  };
  $regions.appendChild(mk('全国', '', UPCOMING.length));
  for(const [name] of REGIONS){
    if(count[name]) $regions.appendChild(mk(name, name, count[name]));
  }
}

// ---- 県チップ（選んだ地域の中で、開催があるものだけ） ----
function buildPrefs(){
  $prefs.innerHTML = '';
  if(!region){ $prefs.hidden = true; return; }
  const keys = (REGIONS.find(r => r[0] === region) || [null, []])[1];
  const count = {};
  for(const e of UPCOMING) if(keys.includes(e.pref)) count[e.pref] = (count[e.pref] || 0) + 1;
  const live = keys.filter(k => count[k]);
  // 県が1つしかない地域（北海道）では、絞り込みにならないので出さない
  if(live.length < 2){ $prefs.hidden = true; return; }
  const mk = (label, value, n) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.v = value;
    b.setAttribute('aria-pressed', value === pref ? 'true' : 'false');
    b.innerHTML = '<span></span><span class="n"></span>';
    b.firstChild.textContent = label;
    b.lastChild.textContent = n;
    return b;
  };
  $prefs.appendChild(mk(region + 'すべて', '', live.reduce((a, k) => a + count[k], 0)));
  for(const k of live) $prefs.appendChild(mk(PREF_LABELS[k], k, count[k]));
  $prefs.hidden = false;
}

function syncChips(){
  for(const b of $regions.querySelectorAll('.chip'))
    b.setAttribute('aria-pressed', b.dataset.v === region ? 'true' : 'false');
  for(const b of $prefs.querySelectorAll('.chip'))
    b.setAttribute('aria-pressed', b.dataset.v === pref ? 'true' : 'false');
}

function render(){
  const months = parseInt($range.value, 10) || 0;
  const q = $q.value.trim();
  let limit = null;
  if(months){ limit = new Date(today); limit.setMonth(limit.getMonth() + months); }
  const inRegion = region
    ? (REGIONS.find(r => r[0] === region) || [null, []])[1] : null;

  const rows = UPCOMING
    .filter(e => {
      if(limit && asDate(e.date) > limit) return false;
      if(inRegion && !inRegion.includes(e.pref)) return false;
      if(pref && e.pref !== pref) return false;
      if(favOnly && !favs.has(shopKey(e))) return false;
      // 検索は切り詰める前の全文で見る
      if(q && !((e.shop || '') + ' ' + (e.name || '')).includes(q)) return false;
      return true;
    })
    .sort((a, b) => a.date.localeCompare(b.date) || (a.label || '').localeCompare(b.label || ''));

  $count.textContent = rows.length ? rows.length + '件' : '';
  $list.innerHTML = '';
  if(!rows.length){
    const msg = favOnly
      ? 'お気に入りの店に、これからの開催予定がありません。'
      : '条件に合う開催情報がありません。';
    $list.innerHTML = '<div class="empty"></div>';
    $list.firstChild.textContent = msg;
    return;
  }

  let month = '';
  for(const e of rows){
    const d = asDate(e.date);
    const key = d.getFullYear() + '-' + (d.getMonth() + 1);
    if(key !== month){
      month = key;
      const h = document.createElement('div');
      h.className = 'month';
      h.textContent = d.getFullYear() + '年 ' + (d.getMonth() + 1) + '月';
      $list.appendChild(h);
    }
    const wd = d.getDay();
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<a class="main" target="_blank" rel="noopener">' +
        '<span class="d ' + (wd === 0 ? 'sun' : wd === 6 ? 'sat' : '') + '">' +
          (d.getMonth() + 1) + '/' + d.getDate() +
          '<span class="wd">(' + WD[wd] + ')</span></span>' +
        '<span class="pf"></span>' +
        '<span class="txt"><span class="sp"></span><span class="nm"></span></span>' +
      '</a>' +
      '<button class="fav" type="button"></button>';
    const a = row.querySelector('.main');
    a.href = e.url;
    a.querySelector('.pf').textContent = e.label || '?';
    a.querySelector('.sp').textContent = e.shop || '';
    // 大会名は会場名の横に。全文は title 属性に残すので、長押し等で読める。
    const nm = eventTitle(e);
    const $nm = a.querySelector('.nm');
    $nm.textContent = nm;
    if(nm) $nm.title = (e.name || '').trim();

    const shop = shopKey(e);
    const btn = row.querySelector('.fav');
    const on = favs.has(shop);
    btn.textContent = on ? '★' : '☆';
    btn.classList.toggle('on', on);
    btn.title = on ? 'お気に入りから外す' : 'このショップをお気に入りに追加';
    btn.setAttribute('aria-label', btn.title + '：' + (shop || '会場名なし'));
    btn.disabled = !shop;
    btn.addEventListener('click', () => {
      if(favs.has(shop)) favs.delete(shop); else favs.add(shop);
      saveFavs();
      syncFavButton();
      render();          // 同じ店の行がまとめて変わるので描き直す
    });
    $list.appendChild(row);
  }
}

$regions.addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if(!b) return;
  region = b.dataset.v;
  pref = '';
  buildPrefs();
  syncChips();
  render();
});
$prefs.addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if(!b) return;
  pref = b.dataset.v;
  syncChips();
  render();
});
$favOnly.addEventListener('click', () => {
  favOnly = !favOnly;
  $favOnly.setAttribute('aria-pressed', favOnly ? 'true' : 'false');
  render();
});
$range.addEventListener('change', render);
$q.addEventListener('input', render);

buildRegions();
buildPrefs();
syncChips();
syncFavButton();
render();
</script>
