<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サイノメ 呪い敵</title>
<style>
  :root { --bg:#f4f1f7; --ink:#2a2233; --grid:#d9d0e3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16121c; --ink:#e8e0f0; --grid:#2c2438; } }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  canvas { display:block; width:100%; height:auto; background:var(--bg); touch-action:none; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  label { display:flex; gap:6px; align-items:center; }
  small { opacity:.7; }
</style>
</head>
<body>
<main>
  <h1 style="font-size:18px;margin:0 0 8px">サイノメ 敵「呪い」— 動きプロトタイプ</h1>
  <canvas id="cv" width="384" height="384"></canvas>
  <div class="row">
    <label><input type="checkbox" id="grid" checked> マス目</label>
    <label>マスサイズ <input type="range" id="cell" min="32" max="96" value="64"> <span id="cellv">64</span>px</label>
    <small id="fps"></small>
  </div>
  <p><small>敵はマス 2×2（4マス分）。Canvas 2D のみ・画像なし・オフスクリーンなし。本体は不透明度40%（透明度60%）のゼリー。毎フレーム：本体パス3本＋泡14＋塊3＋ノイズ触手4。</small></p>
</main>
<script>
/* ============================================================
 * CurseEnemy : 呪いノイズをまとったサイノメ（2×2マス）
 *   const e = new CurseEnemy();
 *   e.update(dt);                // dt: 秒
 *   e.draw(ctx, x, y, cell);     // (x,y)=左上マスの左上座標, cell=1マスのpx
 * ============================================================ */
class CurseEnemy {
  constructor(seed = 1) {
    this.t = 0;
    this.seed = seed;
    // 本体色（ゼリー：上が明るく下が濃い）
    this.bodyTop = '#bb4ff2';
    this.bodyBottom = '#7a14b8';
    this.bodyAlpha = 0.4;               // 透明度60% = 不透明度0.4
    this.rim = '#5c0f8f';
    this.outline = '#111';
    this.tendrilColor = '#9a1fd8';
    this.bubbleColors = ['#3a0a7a', '#2c0f86', '#4e0c92', '#1c0a5e'];
    // 立ち上る泡（本体内のローカル座標 0..1）
    this.bubbles = [];
    for (let i = 0; i < 14; i++) this.bubbles.push(this._newBubble(true));
    // 奥で漂う濃い塊（毒の沈殿）
    this.blobs = [];
    for (let i = 0; i < 3; i++) this.blobs.push({ x: this._rnd(0.25, 0.75), y: this._rnd(0.45, 0.8), r: this._rnd(0.1, 0.16), ph: this._rnd(0, 6.28) });
    // 呪いノイズ触手（少なめ・水平垂直）
    this.tendrils = [];
    for (let i = 0; i < 4; i++) this.tendrils.push(this._newTendril(i / 4));
  }

  _rnd(a, b) { return a + Math.random() * (b - a); }

  _newBubble(initial) {
    return {
      x: this._rnd(0.15, 0.85),
      y: initial ? this._rnd(0.2, 0.9) : this._rnd(0.82, 0.92),
      vy: this._rnd(0.08, 0.2),            // 上昇速度（本体高さ/秒）
      r: this._rnd(0.022, 0.06),
      ph: this._rnd(0, 6.28),
      c: this.bubbleColors[(Math.random() * this.bubbleColors.length) | 0],
      age: initial ? 1 : 0,
    };
  }

  // 辺(0上 1右 2下 3左)上の位置 u から外向きにまっすぐ伸びる。jog≠0 なら途中で直角に段差
  _newTendril(phase = 0) {
    const side = (Math.random() * 4) | 0;
    const len = this._rnd(0.3, 0.7);
    return {
      side, u: this._rnd(0.15, 0.85),
      len,                                           // 最大長（本体幅比）
      w: this._rnd(0.03, 0.05),                      // 太さ
      jogAt: this._rnd(0.3, 0.6) * len,              // 段差を入れる位置
      jog: Math.random() < 0.5 ? (Math.random() < 0.5 ? -1 : 1) * this._rnd(0.05, 0.1) : 0,
      p: phase,                                      // 0→1 で 伸びる→縮む
      speed: this._rnd(0.35, 0.7),
      glitch: 0,
    };
  }

  update(dt) {
    this.t += dt;
    for (let i = 0; i < this.bubbles.length; i++) {
      const b = this.bubbles[i];
      b.y -= b.vy * dt;
      b.vy += 0.03 * dt;                   // 上ほど少し加速
      b.age = Math.min(1, b.age + dt * 2);
      if (b.y < 0.14) this.bubbles[i] = this._newBubble(false);
    }
    for (let i = 0; i < this.tendrils.length; i++) {
      const d = this.tendrils[i];
      d.p += dt * d.speed;
      // たまにマス目方向へカクッとずれる（呪いのノイズ感）
      d.glitch = Math.random() < 0.03 ? (Math.random() < 0.5 ? -1 : 1) * 0.03 : (Math.random() < 0.15 ? 0 : d.glitch);
      if (d.p >= 1) this.tendrils[i] = this._newTendril(0);
    }
  }

  // 触手の根元・法線（本体ローカル 0..1）
  _base(d) {
    switch (d.side) {
      case 0: return { x: d.u, y: 0.07, nx: 0, ny: -1 };
      case 1: return { x: 0.93, y: d.u, nx: 1, ny: 0 };
      case 2: return { x: d.u, y: 0.93, nx: 0, ny: 1 };
      default: return { x: 0.07, y: d.u, nx: -1, ny: 0 };
    }
  }
  // 伸び量 0..1（素早く伸びて、少し留まり、ゆっくり縮む）
  _ext(p) { return p < 0.25 ? p / 0.25 : p < 0.45 ? 1 : 1 - (p - 0.45) / 0.55; }

  // 波打つ角丸四角のパス（S=一辺px, ox,oy=左上）。begin=false で既存パスに追加
  _bodyPath(ctx, ox, oy, S, amp, off, begin = true) {
    const N = 40, t = this.t, cx = ox + S / 2 + off, cy = oy + S / 2 + off;
    const h = S * 0.45;
    if (begin) ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * Math.PI * 2;
      // 角丸四角の極座標半径（超楕円で近似：軽い）
      const c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
      let r = h / Math.pow(Math.pow(c, 5) + Math.pow(s, 5), 0.2) + S * 0.011;
      // 波打ち：低周波サイン3本の合成
      r += amp * S * (0.6 * Math.sin(a * 3 + t * 2.1) + 0.4 * Math.sin(a * 5 - t * 3.3) + 0.25 * Math.sin(a * 9 + t * 5.7));
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  }

  draw(ctx, x, y, cell) {
    const S = cell * 2;                 // 2×2マス
    const X = (v) => x + v * S, Y = (v) => y + v * S;
    ctx.save();

    // --- 触手（本体の後ろ）：直線＋直角の段差、先端は四角 ---
    ctx.strokeStyle = this.tendrilColor; ctx.fillStyle = this.tendrilColor;
    ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    for (const d of this.tendrils) {
      const e = this._ext(d.p);
      if (e <= 0.02) continue;
      const b = this._base(d), L = d.len * e;
      const tx = -b.ny, ty = b.nx;                    // 辺に沿う向き
      const g = d.glitch;
      const w = d.w * S * (0.7 + 0.3 * e);
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(X(b.x), Y(b.y));
      let ex, ey;
      if (d.jog && L > d.jogAt) {
        const kx = b.x + b.nx * d.jogAt, ky = b.y + b.ny * d.jogAt;
        ctx.lineTo(X(kx), Y(ky));
        const jx = kx + tx * d.jog + tx * g, jy = ky + ty * d.jog + ty * g;
        ctx.lineTo(X(jx), Y(jy));
        ex = jx + b.nx * (L - d.jogAt); ey = jy + b.ny * (L - d.jogAt);
      } else {
        ex = b.x + b.nx * L + tx * g; ey = b.y + b.ny * L + ty * g;
        if (g) { ctx.lineTo(X(b.x + b.nx * L * 0.5), Y(b.y + b.ny * L * 0.5)); ctx.lineTo(X(b.x + b.nx * L * 0.5 + tx * g), Y(b.y + b.ny * L * 0.5 + ty * g)); }
      }
      ctx.lineTo(X(ex), Y(ey));
      ctx.stroke();
      // 先端の四角いブロック
      const q = w * 1.5;
      ctx.fillRect(X(ex) - q / 2 + b.nx * q * 0.3, Y(ey) - q / 2 + b.ny * q * 0.3, q, q);
    }
    ctx.globalAlpha = 1;

    // --- 黒い影輪郭：本体の外側にはみ出た部分だけ塗る（透けても中に影が出ない） ---
    ctx.save();
    ctx.beginPath();
    ctx.rect(x - S, y - S, S * 3, S * 3);
    this._bodyPath(ctx, x, y, S, 0.015, 0, false);
    ctx.clip('evenodd');                          // 本体の外側だけ
    this._bodyPath(ctx, x, y, S, 0.012, S * 0.025);
    ctx.fillStyle = this.outline; ctx.fill();
    ctx.restore();

    // --- 本体（半透明ゼリー） ---
    this._bodyPath(ctx, x, y, S, 0.015, 0);
    const grad = ctx.createLinearGradient(0, y, 0, y + S);
    grad.addColorStop(0, this.bodyTop); grad.addColorStop(1, this.bodyBottom);
    ctx.globalAlpha = this.bodyAlpha;
    ctx.fillStyle = grad; ctx.fill();
    ctx.globalAlpha = 1;

    // --- 内部（本体でクリップ） ---
    ctx.save();
    ctx.clip();
    // 奥の濃い塊（ゆっくり脈打つ）
    for (const o of this.blobs) {
      const k = 1 + 0.08 * Math.sin(this.t * 1.3 + o.ph);
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#2a0870';
      ctx.beginPath();
      ctx.arc(X(o.x + 0.02 * Math.sin(this.t * 0.5 + o.ph)), Y(o.y), o.r * S * k, 0, 6.283);
      ctx.fill();
    }
    // 立ち上る泡：濃い円＋左上に小さなハイライト
    for (const b of this.bubbles) {
      const fade = Math.min(1, (b.y - 0.14) / 0.12) * b.age;   // 上端で弾けて消える
      const r = b.r * S * (1 + (0.9 - b.y) * 0.4);             // 上るほど少し膨らむ
      const px = X(b.x + 0.015 * Math.sin(this.t * 3 + b.ph)), py = Y(b.y);
      ctx.globalAlpha = 0.7 * fade;
      ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.arc(px, py, r, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 0.45 * fade;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(px - r * 0.35, py - r * 0.35, r * 0.28, 0, 6.283); ctx.fill();
    }
    // シアンのきらめき
    ctx.fillStyle = '#35e6d8';
    for (let i = 0; i < 5; i++) {
      const f = Math.sin(this.t * 7 + i * 12.9);
      if (f < 0.6) continue;
      ctx.globalAlpha = (f - 0.6) * 2.5;
      const sx = 0.2 + ((i * 0.37 + Math.floor(this.t * 0.7 + i) * 0.61) % 0.6);
      const sy = 0.2 + ((i * 0.53 + Math.floor(this.t * 0.7 + i) * 0.29) % 0.6);
      ctx.fillRect(X(sx), Y(sy), S * 0.018, S * 0.018);
    }
    // ゼリーの照り（左上の楕円ハイライト）
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(X(0.3), Y(0.2), S * 0.16, S * 0.06, -0.5, 0, 6.283);
    ctx.fill();
    ctx.restore();

    // --- 縁取り（ゼリーの縁は濃く見える） ---
    this._bodyPath(ctx, x, y, S, 0.015, 0);
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = this.rim;
    ctx.lineWidth = S * 0.014;
    ctx.stroke();

    ctx.restore();
  }
}

/* ============================ デモ ============================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const gridBox = document.getElementById('grid');
const cellIn = document.getElementById('cell');
const cellV = document.getElementById('cellv');
const fpsEl = document.getElementById('fps');
const enemy = new CurseEnemy();

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = 384 * dpr; cv.height = 384 * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);
cellIn.oninput = () => cellV.textContent = cellIn.value;

let last = performance.now(), acc = 0, frames = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  enemy.update(dt);

  const cell = +cellIn.value, W = 384;
  ctx.fillStyle = getComputedStyle(document.body).backgroundColor;
  ctx.fillRect(0, 0, W, W);
  // 敵を中央の2×2マスに配置
  const n = Math.ceil(W / cell), start = Math.floor(n / 2) - 1;
  const ox = (W - n * cell) / 2;
  if (gridBox.checked) {
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      ctx.moveTo(ox + i * cell + 0.5, 0); ctx.lineTo(ox + i * cell + 0.5, W);
      ctx.moveTo(0, ox + i * cell + 0.5); ctx.lineTo(W, ox + i * cell + 0.5);
    }
    ctx.stroke();
  }
  enemy.draw(ctx, ox + start * cell, ox + start * cell, cell);

  acc += dt; frames++;
  if (acc >= 0.5) { fpsEl.textContent = Math.round(frames / acc) + ' fps'; acc = 0; frames = 0; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
